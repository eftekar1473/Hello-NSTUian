services:
  postgres:
    image: postgres:16-alpine
    container_name: hello-nstuian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hello_nstuian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-nstuian-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/hello_nstuian?schema=public"
      JWT_SECRET: "replace_with_a_secure_random_jwt_secret_key_32_characters"
      JWT_EXPIRES_IN: "7d"
      ALLOWED_EDUMAIL_DOMAINS: "nstu.edu.bd"
      STORAGE_PROVIDER: "local"
      LOCAL_STORAGE_DIR: "./storage/uploads"
      MAX_UPLOAD_SIZE_MB: "25"
    volumes:
      - app_storage:/app/server/storage/uploads
    depends_on:
      - postgres

volumes:
  pgdata:
  app_storage:
